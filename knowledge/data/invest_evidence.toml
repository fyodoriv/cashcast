# Evidence behind the investment recommender (`bin/cashcast invest-plan`).
# Education, not personal advice. The assistant is not a licensed advisor.
#
# Every move the recommender ranks cites facts from this file by `id`. Each fact
# carries its own `source`, `as_of`, `review_by` and `confidence`, and the
# recommender prints them next to the move. Rules (decision 0013):
# - Only facts here (or in investing.toml / corporate_stock.toml) back a move.
# - A return assumption is a long-run planning number, never a forecast. It is
#   shown as a range, with `band` as the width of that range.
# - `estimate` and `heuristic` facts are labelled as such wherever they show up.
# A user can replace a value privately in <user>/knowledge/invest_evidence.toml
# (same `id`), for example after a challenge where their evidence holds.

[meta]
title = "Investment recommender: evidence, assumptions and their limits"
as_of = 2026-11-01
review_by = 2027-04-30
