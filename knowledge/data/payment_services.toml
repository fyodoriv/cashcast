name = "Chexy (rent by credit card)"
fee_rate = 0.0175
fee_flat = 0
membership_fee = 200
membership_rate = 0.015
codes_as = "other"
notes = "Checked 2026-10-19 in a browser on the issuer page. Chexy help centre (updated 2026-09-16): domestic credit card 1.75% standard; Plus annual $200/yr lowers it to 1.5% (Plus monthly $20/month keeps 1.75%); Essential annual $90/yr gives 1.65%. Debit is free with a membership. Credit Builder is Plus-only (legacy access before 2026-06-19 excepted). Existing members may keep an older price; put yours in your private profile."
source = "https://intercom.help/chexy/en/articles/15581136-chexy-membership-what-s-included-and-how-much-it-costs"
confidence = "verified"

