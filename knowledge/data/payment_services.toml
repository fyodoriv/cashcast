# Payment and money-movement services and their costs.
# fee_rate: percent fee as a decimal. fee_flat: CAD per transaction.
# membership_fee: CAD per year (0 = none). membership_rate: fee_rate with membership.
# codes_as: how a credit card usually categorizes the charge, using a
#   credit_cards.toml earn key, "cash_like" (may be a cash advance), or "none".

