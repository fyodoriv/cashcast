# ---------------------------------------------------------------- deadlines

[deadlines]
filing = "April 30"
self_employed_filing = "June 15"
balance_due = "April 30"   # self-employed still pay any balance by April 30
rrsp_contribution_deadline_for_2026 = 2027-03-01
instalment_dates = ["March 15", "June 15", "September 15", "December 15"]
instalment_threshold = 3000      # net tax owing; 1,800 for Quebec residents
instalment_threshold_qc = 1800
notes = "Instalments are required when net tax owing is over the threshold this year AND in either of the two prior years."
