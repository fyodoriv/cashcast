# ---------------------------------------------------------------- limits

[limits]
tfsa_annual = 7000
rrsp_max = 33810                 # 2026 RRSP dollar limit (2027: 35,390)
rrsp_rate = 0.18                 # 18% of prior-year earned income, up to rrsp_max
fhsa_annual = 8000
fhsa_lifetime = 40000
fhsa_carryforward_max = 8000
capital_gains_inclusion = 0.5    # The proposed 2/3 rate was cancelled in March 2025; 1/2 is the law for 2026.
hbp_max = 60000                  # RRSP Home Buyers' Plan withdrawal limit
rrsp_excess_buffer = 2000        # cumulative excess over the deduction limit with no tax (age 18+)
rrsp_excess_tax_monthly = 0.01   # tax per month on the excess above the buffer (form T1-OVP)
notes = "TFSA and RRSP from the CRA limits table. FHSA, HBP, capital gains and the RRSP excess rules (guide T4040) from the extra_sources pages."
extra_sources = [
  "https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/t4040/rrsps-other-registered-plans-retirement.html",
  "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/first-home-savings-account/contributing-your-fhsa.html",
  "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/rrsps-related-plans/what-home-buyers-plan.html",
  "https://www.canada.ca/en/department-finance/news/2025/01/government-of-canada-announces-deferral-in-implementation-of-change-to-capital-gains-inclusion-rate.html",
]
source = "https://www.canada.ca/en/revenue-agency/services/tax/registered-plans-administrators/pspa/mp-rrsp-dpsp-tfsa-limits-ympe.html"
confidence = "verified"

