# ------------------------------------------------------------ Scotiabank

[[accounts]]
id = "scotia-ultimate-package"
bank = "Scotiabank"
name = "Ultimate Package"
monthly_fee = 30.95
waive_min_balance = 6000
min_balance_rule = "6,000 every day of the month, or a 100,000 Total Relationship Balance every day (chequing, savings, GICs, mutual funds)."
card_fee_rebate = 150
rebate_card_ids = ["scotia-momentum-visa-infinite", "scotia-passport-visa-infinite"]
interest_rate = 0
notes = "Rebate up to 150 once a year on one eligible card (Gold Amex, Passport VI+, Passport VI Privilege, Momentum VI+, Value Visa). Seniors 60+ pay 23.95. Unlimited transactions, free non-Scotia ABMs in Canada. Break-even: 371.40 fee / 6,000 = 6.2% return."
source = "https://www.scotiabank.com/ca/en/personal/bank-accounts/chequing-accounts/ultimate-package.html"
confidence = "verified"

