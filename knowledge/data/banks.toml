# Chequing accounts and packages: fee waivers by balance and credit-card fee rebates.
# monthly_fee: CAD per month before any waiver.
# waive_min_balance: balance that waives the fee (0 = no balance waiver).
# card_fee_rebate: max yearly credit-card annual-fee rebate in CAD (0 = none).
# rebate_card_ids: ids from credit_cards.toml that get the rebate (only cards in that file).
# interest_rate: annual rate as a decimal (0 = none or negligible).
# Break-even: holding the minimum balance costs (minimum x your other return).
#   It beats paying the fee when annual_fee / minimum_balance > your other return.

[meta]
title = "Canadian chequing packages, fee waivers and card rebates"
as_of = 2026-10-19
