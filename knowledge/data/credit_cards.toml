# Canadian credit cards, mostly cash back.
#
# earn: category -> cash value per dollar (0.04 = 4%). Points cards are converted
#   to cash value with the point value stated in `notes`.
#   Allowed keys: groceries, gas, ev_charging, transit, rideshare, delivery, dining,
#   entertainment, recurring, streaming, drugstore, travel, foreign, rent, other.
#   `other` is the base rate and is always present. A missing key earns `other`.
#   `foreign` is the earn rate on foreign-currency purchases (before fx_fee).
# rent_rate_from: the date a card's own `rent` rate starts. Rent posted before it
#   earned like the profile's `[rent] codes_as` and still counts toward that cap.
# caps: after `limit` dollars of spend in `categories` within `period`, earn `after_rate`.
#   per_category = true means each listed category has its own limit.
#   period: card_year (from the card's anniversary: set `cap_reset = "MM-DD"` on the
#   card in profile.toml), calendar_year, monthly, or statement (from the day after
#   the statement closes). `bin/cashcast cards now` counts each cap from its period start.
# fx_fee: foreign transaction fee as a decimal (0.025 = 2.5%).
# Welcome bonuses change often; they live in notes, not in earn.

[meta]
title = "Canadian credit cards (cash back focus)"
as_of = 2026-11-15
review_by = 2027-01-31
sources = [
  "https://www.wealthsimple.com/en-ca/credit-card",
  "https://www.scotiabank.com/ca/en/personal/credit-cards/visa/momentum-infinite-card.html",
  "https://www.scotiabank.com/ca/en/personal/credit-cards/visa/passport-infinite-card.html",
  "https://www.td.com/ca/en/personal-banking/products/credit-cards/cash-back/cash-back-visa-infinite-card",
  "https://www.td.com/ca/en/personal-banking/products/credit-cards/cash-back/cash-back-visa-card",
  "https://www.cibc.com/en/personal-banking/credit-cards/all-credit-cards/dividend-visa-infinite-card.html",
  "https://www.cibc.com/en/personal-banking/credit-cards/all-credit-cards/dividend-visa-card.html",
  "https://www.tangerine.ca/en/products/spending/creditcard/money-back",
  "https://www.tangerine.ca/en/products/spending/creditcard/world",
  "https://www.simplii.com/en/credit-cards/cash-back-visa.html",
  "https://www.rbcroyalbank.com/credit-cards/cardholders/cash-back-updates.html",
  "https://www.pcfinancial.ca/en/credit-cards/world-elite",
  "https://www.neofinancial.com/credit-cards/neo-world-elite-mastercard",
  "https://www.mbna.ca/en/credit-cards/rewards/mbna-rewards-world-elite-mastercard",
  "https://www.nbc.ca/personal/mastercard-credit-cards/world-elite.html",
  "https://www.desjardins.com/en/credit-cards/cash-back-world-elite-mastercard.html",
  "https://brimfinancial.com/personal",
]

