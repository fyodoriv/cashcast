# ------------------------------------------------------------ account priority

[[account_priority]]
order = 1
account = "emergency_fund"
when = "Always first: 3-6 months of essential spending in cash (HISA, chequing with interest, CASH or ZMMK)."
why = "Stops forced selling or card debt after a surprise bill or job loss. FCAC suggests 3-6 months of expenses (or income) in a low-fee account."
source = "https://www.canada.ca/en/financial-consumer-agency/services/savings-investments/setting-up-emergency-funds.html"
confidence = "verified"

[[account_priority]]
order = 2
account = "high_interest_debt"
when = "Pay off credit-card or other debt above about 7-8% before investing."
why = "Paying a 20% card balance is a guaranteed 20% return."
source = "https://www.canada.ca/en/financial-consumer-agency/services/debt/paying-debt.html"
confidence = "verified"
notes = "FCAC confirms paying the highest-interest debt first saves the most interest. The 7-8% cut-off versus investing is a rule of thumb."

[[account_priority]]
order = 3
account = "employer_match"
when = "If the employer matches RRSP/DPSP/pension contributions."
why = "A match is an instant 50-100% return."
source = "https://www.canada.ca/en/financial-consumer-agency/services/retirement-planning/employer-sponsored-pension.html"
confidence = "heuristic"
notes = "Rule of thumb: a match is free money. The FCAC page confirms employers may contribute to group RRSPs and pensions; the ordering is judgment."

[[account_priority]]
order = 4
account = "FHSA"
when = "First-time home buyer (no owned home this year or the prior 4 years), age 18+, and could buy a home within about 15 years."
why = "Deduction on the way in AND tax-free on the way out for a home. 8,000/yr, 40,000 lifetime; unused money can move to an RRSP without using RRSP room."
source = "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/first-home-savings-account.html"
confidence = "verified"

[[account_priority]]
order = 5
account = "RRSP"
when = "Marginal rate now is higher than the expected rate in retirement (rule of thumb: income above about 58,000 federal 2nd bracket)."
why = "Deduct at a high rate now, withdraw at a lower rate later. Also best home for US-listed ETFs and bonds."
source = "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/rrsps-related-plans/registered-retirement-savings-plan-rrsp.html"
confidence = "verified"
notes = "CRA confirms deductible contributions and taxable withdrawals. The 58,000 income cut-off is a rule of thumb."

[[account_priority]]
order = 6
account = "TFSA"
when = "Low or middle income, or after RRSP/FHSA; also for any money you may need before retirement."
why = "Growth and withdrawals are tax-free; withdrawals do not count as income (no OAS or benefit clawback); room comes back next year."
source = "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/tax-free-savings-account.html"
confidence = "verified"

[[account_priority]]
order = 7
account = "non_registered"
when = "After registered room is full."
why = "Taxable, but only 50% of capital gains is taxed and Canadian dividends get the dividend tax credit. Track ACB."
source = "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/personal-income/line-12700-capital-gains.html"
confidence = "verified"

# ------------------------------------------------------------ asset location

[[asset_location]]
asset = "US-listed US equity ETFs (VTI, SCHD, VYM)"
best_account = "RRSP"
why = "The Canada-US treaty exempts RRSPs from the 15% US dividend withholding. TFSAs and RESPs are not exempt."
source = "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/deductions-credits-expenses/line-40500-federal-foreign-tax-credit.html"
confidence = "verified"

[[asset_location]]
asset = "Canadian-listed US equity ETFs (VFV, XUU, VUN)"
best_account = "TFSA"
why = "Withholding is lost in TFSA and RRSP alike; the cost is small (about 0.2%/yr). In non-registered you can claim the foreign tax credit."
source = "https://www.blackrock.com/ca/investors/en/literature/brochure/withholding-tax-reference-guide-en-ca.pdf"
confidence = "verified"
notes = "BlackRock Canada withholding-tax guide (2026-10-19): a Canadian-listed ETF holding US stocks has 15% withheld inside the fund in every account type, not recoverable in an RRSP or TFSA; in a non-registered account the foreign tax credit applies (CRA line 40500). The 0.2%/yr size is approximate (15% of a ~1.3% yield)."

[[asset_location]]
asset = "Canadian equity (XIC, VDY)"
best_account = "non_registered"
why = "Eligible Canadian dividends get the dividend tax credit only in a taxable account. Also fine in a TFSA."
source = "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/deductions-credits-expenses/line-40425-federal-dividend-tax-credit.html"
confidence = "verified"

[[asset_location]]
asset = "Bonds and GICs (ZAG, XBB)"
best_account = "RRSP"
why = "Interest is taxed at your full marginal rate; shelter it first."
source = "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/personal-income/investment-income.html"
confidence = "verified"

[[asset_location]]
asset = "Highest expected growth (all-equity ETFs)"
best_account = "TFSA"
why = "Tax-free growth compounds best on the assets that grow most."
source = "https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/rc4466/tax-free-savings-account-tfsa-guide-individuals.html"
confidence = "verified"
notes = "CRA RC4466: TFSA investment income is generally tax-free, even when withdrawn. Placing growth assets there is a rule of thumb built on that fact."

[[asset_location]]
asset = "All-in-one ETFs (XEQT, VEQT, XGRO, VGRO)"
best_account = "any"
why = "Simplicity beats small location gains for most people. Hold the same fund everywhere and rebalance by contribution."
source = "https://www.blackrock.com/ca/investors/en/learning-centre/etf-education/asset-allocation-etfs"
confidence = "verified"

[[asset_location]]
asset = "Short-term cash (CASH, ZMMK, HISA)"
best_account = "TFSA"
why = "Interest is fully taxable; a TFSA shelters it and keeps it withdrawable."
source = "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/tax-free-savings-account.html"
confidence = "verified"

